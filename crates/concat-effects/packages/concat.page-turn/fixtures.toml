# Colours in the working space: linear light, 1.0 the white of an SDR
# picture. A cut from one colour to another, and its middle pixel.

# Early in the turn the middle of the frame is under the sheet folded
# back over itself: the print through pale paper.
[[probe]]
name = "default"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.37
expect = [0.87, 0.78, 0.72, 1]

# Before it starts the shot is untouched.
[[probe]]
name = "start"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.0
expect = [0.8, 0.5, 0.3, 1]

# Past the end of the folded-back sheet the shot is under its far shadow.
[[probe]]
name = "minimum"
at = "min"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.2
expect = [0.79356, 0.49597, 0.29758, 1]
tolerance = 0.01

# From the left, late: the sheet has gone and the next shot is left,
# with only the last of the shadow on it.
[[probe]]
name = "maximum"
at = "max"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.9
expect = [0.04906, 0.14719, 0.3925, 1]
tolerance = 0.01

# At the end it is the next shot.
[[probe]]
name = "end"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 1.0
expect = [0.04992, 0.14977, 0.39939, 1]
