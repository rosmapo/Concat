name: CI

# The engine's tests and lints on every push and pull request. The bundles
# are built by release.yml, on a tag; see that file.
#
# Every action is pinned to a commit, with the tag it was in a comment
# beside it: a tag can be moved to other code after a run has trusted it,
# a commit cannot. Dependabot proposes the bumps (.github/dependabot.yml).
# The prebuilt libraries the jobs download are pinned the same way, by
# digest, in scripts/ci/deps.lock.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this before it builds anything: a tag on a red tree
  # is not a release. It names the tag, because a release started by hand
  # runs on main, and main is not what it builds.
  workflow_call:
    inputs:
      ref:
        description: The ref to test, when it is not the one this runs on
        type: string
        default: ""

# Keyed on what is tested, so a release testing its tag and a push to
# main never cancel each other. Only a pull request's run is cancelled by
# the next push to it: a run on main is the record of whether main is
# green, and cancelling it leaves a gap where the answer should be.
concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The checks that need no libraries, in a job of their own: a string
  # slip or an unformatted line fails here in a minute, and no longer
  # skips clippy and the tests behind it.
  checks:
    name: Format, locales and models
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: The pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (v1), 2026-10-09
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - run: cargo fmt --check
        working-directory: src
      # Every string the interface shows is a key in a locale file; this
      # keeps en.json the inventory of them and every shipped language
      # keyed off it. See TRANSLATING.md.
      - run: python3 scripts/locales.py --check
        if: ${{ !cancelled() }}
      # The models Concat downloads are mirrored onto a release of this
      # repository; models/manifest.toml is what fills that mirror and the
      # engine's tables are what a download is checked against. This keeps
      # the two saying the same thing. See models/manifest.toml.
      - run: python3 scripts/models.py --check
        if: ${{ !cancelled() }}

  engine:
    name: Engine tests and lints
    runs-on: ubuntu-24.04
    # The steps that can run long have timeouts of their own, 180 minutes
    # between them, so a stuck step is named by its own timeout; this is
    # for a job stuck anywhere else.
    timeout-minutes: 200
    env:
      # See build-app.yml: the version the ort crate is built against.
      # scripts/ci/deps.lock pins the file.
      ORT_VERSION: 1.28.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # The toolchain src/rust-toolchain.toml pins, installed by name: every
      # cargo command below runs from src/, where the pin applies, so a
      # stable installed here would only be fetched and left.
      - name: The pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (v1), 2026-10-09
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      # cargo-nextest runs the tests: each in a process of its own, with a
      # timeout per test and a JUnit report. See src/.config/nextest.toml.
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-nextest@0.9.148
      # Saved even when the job fails: a cache saved only by a green run
      # is never saved while the job is red, and every red run then
      # compiles from nothing.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
          cache-on-failure: true

      # Slint's Skia renderer links fontconfig and freetype; cpal links
      # ALSA; bindgen needs libclang; whisper.cpp is built by cmake; the
      # file dialogs link GTK on Linux. Mesa's Vulkan drivers bring
      # lavapipe, a software GPU, so the compositor's parity suite runs
      # here rather than skipping for want of an adapter.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgl1-mesa-dev \
            libgtk-3-dev libasound2-dev libclang-dev cmake \
            libvulkan1 mesa-vulkan-drivers

      # Ubuntu's packaged FFmpeg is older than the 7 the engine needs, so the
      # libraries come from BtbN, and FFMPEG_DIR tells the bindings where.
      - name: FFmpeg development libraries
        run: |
          set -euo pipefail
          scripts/ci/fetch.sh ffmpeg-linux64 ffmpeg.tar.xz
          mkdir -p ffmpeg-dev
          tar -xf ffmpeg.tar.xz -C ffmpeg-dev --strip-components=1
          echo "FFMPEG_DIR=$PWD/ffmpeg-dev" >> "$GITHUB_ENV"

      # ONNX Runtime as a shared library, linked dynamically, as the
      # Linux bundle links it (see build-app.yml). The tests then find it
      # through LD_LIBRARY_PATH, as they find FFmpeg.
      - name: ONNX Runtime
        run: |
          set -euo pipefail
          stem="onnxruntime-linux-x64-$ORT_VERSION"
          scripts/ci/onnxruntime.sh linux-x64
          test -f "$stem/lib/libonnxruntime.so.$ORT_VERSION"
          ln -sf "libonnxruntime.so.$ORT_VERSION" "$stem/lib/libonnxruntime.so"
          {
            echo "ORT_LIB_LOCATION=$PWD/$stem/lib"
            echo "ORT_PREFER_DYNAMIC_LINK=1"
            echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib:$PWD/$stem/lib"
          } >> "$GITHUB_ENV"

      # -D warnings covers rustc lints too (missing_docs among them), so a
      # public item without documentation fails here, not in review. Lints
      # before tests: they finish in a fraction of the time and catch the
      # most. The window's crate is linted on its own: its generated UI
      # (some 86 MB of Rust) takes 7.5 GB and about 17 minutes here for
      # each rustc that reads it. --all-targets reads it twice, the library
      # and the library's tests: two at once ran the 16 GB runner out of
      # memory (exit 143, every run 2026-11-04 to 11-10), and one after the
      # other ran past 35 minutes. So it is read once, in test mode
      # (--profile test), which is all of the library's code and its tests
      # in one rustc. The Android shell is linted over a plain check of the
      # library (--no-deps), not a second Clippy pass. The binary (main.rs
      # and launch.rs) is not linted: selecting it makes the library a
      # primary unit, which is a full second Clippy pass over the UI for
      # 270 lines. It is still built and its tests run below.
      # The rest of the workspace keeps every core.
      - name: Clippy
        timeout-minutes: 25
        working-directory: src
        run: |
          set -o pipefail
          cargo clippy --workspace --exclude concat --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: Clippy (the window)
        timeout-minutes: 30
        working-directory: src
        run: |
          set -o pipefail
          cargo clippy -p concat --lib --profile test -- -D warnings 2>&1 | tee clippy-window.log

      # The tests are compiled in a step of their own, so a slow compile
      # and a slow test are told apart by which step ran out of time. One
      # job at a time and no debug info, to stay inside the runner's
      # memory; the run below finds everything already built.
      # A cold cache, one build job at a time, has run past 25 minutes.
      - name: Build the tests
        id: build-tests
        timeout-minutes: 50
        working-directory: src
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -o pipefail
          cargo nextest run --workspace --no-run --build-jobs 1 2>&1 | tee build-tests.log
      # CONCAT_REQUIRE_GPU: the GPU tests fail rather than skip when no
      # adapter is usable, so the parity suite is known to have run. The
      # report and the log are kept when it fails (the last step). The
      # corpus is left to the step after this one.
      - name: Run the tests
        timeout-minutes: 20
        working-directory: src
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CONCAT_REQUIRE_GPU: "1"
        run: |
          set -o pipefail
          status=0
          cargo nextest run --workspace --build-jobs 1 --profile ci \
            -E 'not package(concat-corpus)' 2>&1 | tee nextest-workspace.log || status=$?
          mv target/nextest/ci/junit.xml target/nextest/ci/junit-workspace.xml 2>/dev/null || true
          exit "$status"
      # The corpus (src/corpus, run by concat-corpus): small projects built
      # through the API, exported through the app's own export and checked
      # frame by frame. In a step of its own, so a red corpus and a red
      # unit test are told apart at a glance, with a timeout of its own;
      # it runs whether or not the tests above passed. --workspace and a
      # filter rather than -p concat-corpus: -p resolves the features of
      # that one package, and the tree built above would be built again.
      - name: Run the corpus
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' }}
        timeout-minutes: 15
        working-directory: src
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -o pipefail
          status=0
          cargo nextest run --workspace --build-jobs 1 --profile ci \
            -E 'package(concat-corpus)' 2>&1 | tee nextest-corpus.log || status=$?
          mv target/nextest/ci/junit.xml target/nextest/ci/junit-corpus.xml 2>/dev/null || true
          exit "$status"
      # nextest does not run the examples in the documentation; cargo does.
      - name: Run the documentation's examples
        timeout-minutes: 10
        working-directory: src
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo test --workspace --doc -j 1
      # The gRPC transport is a feature nothing else in the workspace turns
      # on, so it is linted and tested here on its own. See concat-server.
      - name: Clippy (gRPC)
        timeout-minutes: 10
        working-directory: src
        run: |
          set -o pipefail
          cargo clippy -p concat-server -p concat-cli --features grpc --all-targets -- -D warnings 2>&1 | tee clippy-grpc.log
      - name: Run the gRPC tests
        timeout-minutes: 10
        working-directory: src
        run: |
          set -o pipefail
          status=0
          cargo nextest run -p concat-server --features grpc --profile ci 2>&1 | tee nextest-grpc.log || status=$?
          mv target/nextest/ci/junit.xml target/nextest/ci/junit-grpc.xml 2>/dev/null || true
          exit "$status"

      # A job's log needs a signed-in session to read; annotations do not.
      # The cargo steps above tee their output, and this turns the
      # failures in it into annotations on the run (scripts/ci/annotate.py).
      - name: Failures to annotations (failure only)
        if: failure()
        run: python3 scripts/ci/annotate.py src/clippy.log src/clippy-window.log src/build-tests.log src/nextest-workspace.log src/nextest-corpus.log src/clippy-grpc.log src/nextest-grpc.log

      - name: Keep the test report (failure only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-linux
          path: |
            src/target/nextest/ci/*.xml
            src/nextest-*.log
          if-no-files-found: ignore
      # Each corpus case's result.json and the frames that failed it, as
      # PNGs: what a red case looked like, without running it again.
      - name: Keep the corpus report (failure only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-linux
          path: src/target/corpus/
          if-no-files-found: ignore
